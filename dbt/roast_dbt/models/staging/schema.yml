version: 2

sources:
  - name: roast_warehouse
    database: "{{ target.project }}"
    schema: roast_warehouse
    # Warn if the pipeline hasn't loaded anything in a day — catches a
    # silently-failing DAG, which is the failure mode you'd otherwise only
    # notice when a dashboard looks stale.
    freshness:
      warn_after: {count: 24, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: ingested_at
    tables:
      - name: reviews
      - name: clusters
      - name: upload_metrics
        loaded_at_field: created_at

models:
  - name: stg_reviews
    description: One row per review, typed and renamed from the warehouse table.
    columns:
      - name: review_id
        tests: [not_null]
      - name: tenant_id
        tests: [not_null]
      - name: actionability_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              where: "actionability_score is not null"

  - name: stg_clusters
    description: One row per issue cluster, with the stable cross-run issue_fingerprint.
    columns:
      - name: cluster_id
        tests: [unique, not_null]
      - name: issue_fingerprint
        description: Stable identity for the same issue across pipeline versions.
        tests: [not_null]
      - name: severity
        tests:
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']
      - name: tenant_id
        tests: [not_null]

  - name: stg_upload_metrics
    description: One row per pipeline run, tagged by pipeline_version (v1/v2/v3 shadow deployments).
    columns:
      - name: upload_id
        tests: [not_null]
      - name: pipeline_version
        tests: [not_null]
    tests:
      # One row per (upload, version) — a duplicate here would double-count
      # a run and corrupt the regression comparison.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [upload_id, pipeline_version]
