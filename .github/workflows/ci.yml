name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  # Cancel superseded runs on the same branch — no point burning minutes
  # on a commit that's already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      # Scoped to the modules this re-architecture owns. Widen the paths as
      # the rest of the codebase is brought up to lint-clean — but these
      # DO fail the build, so a regression here can't merge.
      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check \
            src/infrastructure/messaging/ \
            src/infrastructure/warehouse/ \
            app/core/pipeline_factory.py \
            tests/ \
            --output-format=github

      # Unit tests only — integration tests need live services and run in
      # their own job below.
      - name: Unit tests
        working-directory: backend
        run: pytest tests/ -v --tb=short -m "not integration"

  integration:
    name: Integration — live Kafka, GCS, BigQuery, Postgres
    runs-on: ubuntu-latest
    needs: backend
    services:
      # Real Kafka in KRaft mode. These are the tests that caught the
      # dead-letter-loss-on-shutdown bug; unit tests never open a socket
      # and could not have found it.
      kafka:
        image: apache/kafka:3.8.0
        ports: ['9092:9092']
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

      bigquery:
        image: ghcr.io/goccy/bigquery-emulator:latest
        ports: ['9050:9050']

      # Throwaway Postgres for the consumer-inbox tests. Deliberately NOT
      # the app's real DATABASE_URL — those tests apply migrations and
      # truncate tables.
      postgres:
        image: postgres:16-alpine
        ports: ['55432:5432']
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: roast_test
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # fake-gcs-server is started manually rather than as a service
      # container because it needs command-line flags, which the `services`
      # block cannot supply.
      - name: Start GCS emulator
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server:latest \
            -scheme http -port 4443 -external-url http://localhost:4443 -backend memory

      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            if nc -z localhost 9092 && nc -z localhost 4443 && \
               nc -z localhost 9050 && nc -z localhost 55432; then
              break
            fi
            sleep 2
          done
          nc -z localhost 9092  || { echo "::error::Kafka never came up"; exit 1; }
          nc -z localhost 4443  || { echo "::error::GCS emulator never came up"; exit 1; }
          nc -z localhost 9050  || { echo "::error::BigQuery emulator never came up"; exit 1; }
          nc -z localhost 55432 || { echo "::error::Postgres never came up"; exit 1; }

      # NOTE: the tests skip themselves when a service is unreachable, which
      # would let a broken service pass silently. The wait step above fails
      # the job first, and this asserts a non-zero test count so a
      # fully-skipped run is treated as a failure.
      - name: Integration tests
        working-directory: backend
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          GCS_EMULATOR_HOST: localhost:4443
          BIGQUERY_EMULATOR_HOST: localhost:9050
          TEST_POSTGRES_DSN: postgresql+psycopg2://test:test@localhost:55432/roast_test
        run: pytest tests/integration/ -v --tb=short -m integration

      - name: Dump emulator logs on failure
        if: failure()
        run: docker logs fake-gcs 2>&1 | tail -50

  terraform:
    name: Terraform — validate & schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The Python *_SCHEMA constants are the single source of truth; the
      # Terraform JSON is generated from them. If someone adds a column in
      # Python and forgets to regenerate, the load job starts failing in
      # production against a table Terraform still thinks is correct. This
      # makes that divergence a build failure instead.
      - name: Check generated BigQuery schemas are current
        run: |
          python infra/terraform/generate_schemas.py
          if ! git diff --exit-code --stat infra/terraform/schemas/; then
            echo "::error::infra/terraform/schemas/ is stale. Run: python infra/terraform/generate_schemas.py"
            exit 1
          fi
          echo "OK — generated schemas match bigquery_sink.py"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init & validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false
          terraform validate

  dbt:
    name: dbt — parse & test
    runs-on: ubuntu-latest
    # `secrets` isn't a recognized context inside `if:` — GitHub rejects the
    # whole workflow file at parse time if it's referenced there directly.
    # Read it into a job-level env var first, then branch on that instead.
    env:
      HAS_BQ_SERVICE_ACCOUNT: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Pinned deliberately. A bare `pip install dbt-bigquery` resolved to
      # dbt-core-experimental-parser 2.0.0rc1 with no dbt-core and no CLI
      # entrypoint at all — a green-looking install that cannot run dbt.
      # Pin both packages so CI can't drift into that state.
      - name: Install dbt
        run: pip install "dbt-core~=1.9.0" "dbt-bigquery~=1.9.0"

      - name: Write CI profile
        working-directory: dbt/roast_dbt
        run: |
          cat > profiles.yml <<'EOF'
          roast_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: service-account-json
                project: "${{ secrets.GCP_PROJECT_ID || 'ci-stub-project' }}"
                dataset: roast_warehouse
                keyfile_json: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT || '{"type":"service_account","project_id":"stub"}' }}
                threads: 4
                location: US
          EOF

      - name: dbt deps
        working-directory: dbt/roast_dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt deps

      # Parse validates every model's SQL/Jinja, refs and test definitions
      # without touching BigQuery — so this gate runs on every PR, with no
      # credentials, and it is NOT allowed to fail.
      - name: dbt parse
        working-directory: dbt/roast_dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt parse

      # Full build only when a real service account is configured.
      - name: dbt build (live warehouse)
        if: ${{ env.HAS_BQ_SERVICE_ACCOUNT == 'true' }}
        working-directory: dbt/roast_dbt
        env:
          DBT_PROFILES_DIR: .
        run: dbt build   # run + test in dependency order; fails on any test failure

  docker:
    name: Docker — build image
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: roast-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dag-validation:
    name: Airflow — DAG import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Airflow lags on 3.13 support

      - name: Install Airflow
        run: pip install "apache-airflow==2.10.*"

      # Catches the classic failure mode: a DAG file that raises on import
      # and therefore silently never appears in the scheduler. Also asserts
      # the structural guarantees the pipeline depends on, so a careless
      # edit can't quietly drop a retry budget or the staging cleanup.
      - name: Verify DAG imports and structure
        env:
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
          DATABASE_URL: 'postgresql://stub:stub@localhost:5432/stub'
        run: |
          airflow db migrate
          python - <<'PY'
          import sys
          from airflow.models.dagbag import DagBag

          bag = DagBag(include_examples=False)
          if bag.import_errors:
              for path, err in bag.import_errors.items():
                  print(f"::error file={path}::{err}")
              sys.exit(1)

          DAG_ID = "roast_bulk_review_pipeline"
          if DAG_ID not in bag.dags:
              print(f"::error::{DAG_ID} not found. Found: {list(bag.dags)}")
              sys.exit(1)

          dag = bag.dags[DAG_ID]
          failures = []

          expected_chain = [
              "load_and_validate",
              "filter_noise",
              "score_actionability",
              "generate_embeddings",
              "cluster_and_rank",
              "load_warehouse",
              "cleanup_staging",
          ]
          actual = [t.task_id for t in dag.topological_sort()]
          if actual != expected_chain:
              failures.append(f"task order changed: {actual} != {expected_chain}")

          embed = dag.get_task("generate_embeddings")
          if embed.retries < 5:
              failures.append(
                  f"generate_embeddings retries dropped to {embed.retries} "
                  "(the slow CPU-bound stage needs its own retry budget)"
              )
          if embed.execution_timeout is None:
              failures.append("generate_embeddings lost its execution_timeout")

          cleanup = dag.get_task("cleanup_staging")
          if str(cleanup.trigger_rule) != "all_success":
              failures.append(
                  f"cleanup_staging trigger_rule is {cleanup.trigger_rule}, expected "
                  "all_success — a failed run must KEEP its staged artifacts "
                  "for post-mortem"
              )

          for task in dag.tasks:
              if task.retries < 1:
                  failures.append(f"{task.task_id} has no retries configured")

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)

          print(f"OK — {DAG_ID}: {len(dag.tasks)} tasks, chain and retry policy intact")
          PY
